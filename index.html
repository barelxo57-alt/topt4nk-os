return `<div class='card bdc btn' style='${bgx('#30d158')}' onclick='hSheet(2)'><div class='bdt'><span style='color:#30d158;font-weight:700'>יעד גוף</span><span class='mu'>${ago==null?'אין שקילות':ago==0?'נשקלת היום':ago==1?'שקילה אתמול':'שקילה לפני '+ago+' ימים'}</span></div>
<div class='bdr2'><b>${cu}<small> ק״ג</small></b><span class='mu'>←</span><b style='color:#30d158'>${B.g}<small> ק״ג</small></b><span class='bdl'>${left>0?'נשארו '+left+' ק״ג':'הגעת ליעד 🏆'}</span></div>
<div class='pb' style='--gc:#30d158'><i style='width:${Math.round(pr*100)}%'></i></div><div class='bdm'><span>${Math.round(pr*100)}% מהדרך · התחלה ${B.s}</span><span>שומן ${lf?lf.bf+'%':'—'} / ${B.bf}%</span></div></div>`}

// ===== habits to break
function hbDays(x){return Math.max(0,Math.floor((new Date(dk())-new Date(x.st))/864e5))}
function hbCard(){const L=S.hb||[];return `<div class='sec2' style='padding:4px 6px 0;display:flex;justify-content:space-between;align-items:center'><span>הרגלים לשבור</span><button class='pill sm' onclick='hbEdit(-1)'>+ הרגל</button></div>${L.length?L.map((x,i)=>{const d=hbDays(x),c='#ff453a',nx=[1,3,7,14,30,60,90,180,365].find(v=>v>d)||d+1,p=d/nx;return `<div class='card gk hbk' style='${bgx(c,'1e')}'><svg width='54' height='54' viewBox='0 0 120 120' style='flex:none' onclick='hbEdit(${i})'>${ring(46,p,c)}<text x='60' y='70' text-anchor='middle' fill='#fff' font-size='34' font-weight='800'>${d}</text></svg><div class='tx' onclick='hbEdit(${i})'><div class='tt' style='font-size:17px'>${esc(x.n)}</div><div class='pv'>${d==1?'יום אחד':d+' ימים'} נקי · יעד הבא ${nx} · שיא ${Math.max(x.best||0,d)}</div></div><button class='hbf' onclick='hbFail(${i})'>נפלתי</button></div>`}).join(''):`<div class='card gk btn' style='${bgx('#ff453a','14')}' onclick='hbEdit(-1)'><div class='tx'><div class='tt' style='font-size:16px'>תוסיף הרגל שאתה רוצה להפסיק</div><div class='pv'>טלפון בבוקר, ג׳אנק, דחיינות – כל יום נקי נספר</div></div><span style='font-size:24px'>🧱</span></div>`}`}
function hbFail(i){const x=S.hb[i],d=hbDays(x);x.best=Math.max(x.best||0,d);(x.log=x.log||[]).push({d:dk(),n:d});x.st=dk();save();FX.toast(d?`נשבר אחרי ${d} ימים. מתחילים מחדש – עכשיו 💪`:'מתחילים מחדש 💪','#ff453a');render()}
function hbEdit(i){const x=i>=0?S.hb[i]:{n:'',st:dk()},c='#ff453a';
sheet(i>=0?'עריכת הרגל':'הרגל חדש',fGrp(c,`<div class='frow'><input id='hbn' class='w' value='${esc(x.n)}' placeholder='לדוגמה: טלפון בשעה הראשונה'></div>`,'מה אתה מפסיק?')+fGrp(c,fRow('נקי מאז',`<input id='hbs' type='date' value='${x.st}' style='width:150px'>`)+(i>=0?fRow('שיא',`<b>${Math.max(x.best||0,hbDays(x))} ימים</b>`)+fRow('נפילות',`<b>${(x.log||[]).length}</b>`):''))+
`<button class='pr' onclick='hbSv(${i})'>שמור</button>${i>=0?`<button class='dg' style='margin-top:10px;width:100%' onclick='S.hb.splice(${i},1);save();closeSh();render()'>מחק הרגל</button>`:''}`)}
function hbSv(i){const n=$('#hbn').value.trim();if(!n)return;const st=$('#hbs').value||dk();S.hb=S.hb||[];if(i>=0)Object.assign(S.hb[i],{n,st});else S.hb.push({id:Date.now(),n,st,best:0,log:[]});save();closeSh();render()}
// ===== quick meals
function mls(){return S.ml||(S.ml=[{n:'שייק חלבון',p:25,c:3,f:2,k:130}])}
function mlBlock(){const d=day(),lg=d.mlog||[];return `<div class='sec2' style='padding:10px 6px 0;display:flex;justify-content:space-between;align-items:center'><span>ארוחות מהירות</span><button class='pill sm' onclick='mlEdit(-1)'>+ ארוחה</button></div><div class='mlg'>${mls().map((m,i)=>`<button class='mlc' onclick='mlAdd(${i})' oncontextmenu='event.preventDefault();mlEdit(${i})'><b>${esc(m.n)}</b><small>${m.p}ח · ${m.c}פ · ${m.f}ש · ${m.k} קק״ל</small><i onclick='event.stopPropagation();mlEdit(${i})'>⋯</i></button>`).join('')}</div>${lg.length?`<div class='sec2' style='padding:10px 6px 0'>נאכל היום</div>${lg.map((m,j)=>`<div class='card gk' style='${bgx('#ff7a59','16')}'><div class='tx'><div class='tt' style='font-size:16px'>${esc(m.n)}</div><div class='pv'>${m.p} חלבון · ${m.c} פחמימה · ${m.f} שומן · ${m.k} קק״ל</div></div><button class='ib' onclick='mlDel(${j})'>${TR}</button></div>`).join('')}`:''}`}
function mlAdd(i){const m=mls()[i],d=day();['p','c','f','k'].forEach(a=>d[a]=(+d[a]||0)+(+m[a]||0));(d.mlog=d.mlog||[]).push({n:m.n,p:m.p,c:m.c,f:m.f,k:m.k});save();FX.toast(`+ ${m.n}`,'#ff7a59');hSheet(1)}
function mlDel(j){const d=day(),m=d.mlog[j];['p','c','f','k'].forEach(a=>d[a]=Math.max(0,(+d[a]||0)-(+m[a]||0)));d.mlog.splice(j,1);save();hSheet(1)}
function mlEdit(i){const m=i>=0?mls()[i]:{n:'',p:0,c:0,f:0,k:0},c='#ff7a59',N=(id,v)=>`<input id='${id}' type='number' inputmode='numeric' value='${v}'>`;
sheet(i>=0?'עריכת ארוחה':'ארוחה חדשה',fGrp(c,`<div class='frow'><input id='mln' class='w' value='${esc(m.n)}' placeholder='שם הארוחה'></div>`,'שם')+fGrp(c,fRow('חלבון (ג׳)',N('mlp',m.p))+fRow('פחמימה (ג׳)',N('mlc',m.c))+fRow('שומן (ג׳)',N('mlf',m.f))+fRow('קלוריות',N('mlk',m.k)),'ערכים')+
`<button class='pr' onclick='mlSv(${i})'>שמור</button>${i>=0?`<button class='dg' style='margin-top:10px;width:100%' onclick='mls().splice(${i},1);save();hSheet(1)'>מחק ארוחה</button>`:''}`)}
function mlSv(i){const n=$('#mln').value.trim();if(!n)return;const g=x=>+$('#ml'+x).value||0,o={n,p:g('p'),c:g('c'),f:g('f'),k:g('k')};if(i>=0)mls()[i]=o;else mls().push(o);save();hSheet(1)}
// ===== progress photos (IndexedDB, on this device)
function phDB(){return new Promise((res,rej)=>{const r=indexedDB.open('topt4nk_ph',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function phAll(){try{const db=await phDB();return await new Promise(r=>{const q=db.transaction('p').objectStore('p').getAll();q.onsuccess=()=>r(q.result.sort((a,b)=>a.id-b.id));q.onerror=()=>r([])})}catch(e){return []}}
async function phPut(o){const db=await phDB();await new Promise((r,j)=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(o);t.oncomplete=r;t.onerror=()=>j(t.error)})}
async function phDel(id){const db=await phDB();await new Promise(r=>{const t=db.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=r});S.phn=Math.max(0,(S.phn||1)-1);save();closeSh();setTimeout(()=>hSheet(2),300)}
function phRead(inp){const f=inp.files&&inp.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=async()=>{const W=720,s=Math.min(1,W/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
const l=S.wt[S.wt.length-1];try{await phPut({id:Date.now(),d:dk(),w:l&&l.d==dk()?l.w:bdCur(),src:c.toDataURL('image/jpeg',.78)});S.phn=(S.phn||0)+1;save();FX.toast('התמונה נשמרה 📸','#30d158');phBlock();chkAw()}catch(e){FX.toast('לא הצלחתי לשמור את התמונה','#ff453a')}};im.src=u}
async function phBlock(){const el=$('#phb');if(!el)return;const P=await phAll();
el.innerHTML=`<div class='sec2' style='padding:10px 6px 0;display:flex;justify-content:space-between;align-items:center'><span>תמונות התקדמות</span>${P.length>1?`<button class='pill sm' onclick='phCmp()'>לפני / אחרי</button>`:''}</div><div class='phg'><label class='phc phn'><span>＋</span><small>תמונה</small><input type='file' accept='image/*' style='display:none' onchange='phRead(this)'></label>${P.slice().reverse().map(p=>`<div class='phc' onclick='phView(${p.id})'><img src='${p.src}' alt=''><small>${FD(p.d)}${p.w?' · '+p.w:''}</small></div>`).join('')}</div><div class='mu' style='font-size:12px;padding:6px'>התמונות נשמרות רק במכשיר הזה ולא נכנסות לגיבוי.</div>`}
async function phView(id){const p=(await phAll()).find(x=>x.id==id);if(!p)return;sheet('תמונת התקדמות',`<img src='${p.src}' class='phv' alt=''><div class='card gk'><div class='tx'><div class='tt'>${FD(p.d)}</div><div class='pv'>${p.w?p.w+' ק״ג':''}</div></div></div><button class='dg' style='width:100%' onclick='phDel(${p.id})'>מחק תמונה</button>`)}
async function phCmp(a,b){const P=await phAll();if(P.length<2)return;a=a==null?0:a;b=b==null?P.length-1:b;const A=P[a],B=P[b],o=(sel,v)=>`<select onchange='phCmp(${sel=='a'?'+this.value':a},${sel=='b'?'+this.value':b})'>${P.map((p,i)=>`<option value='${i}' ${i==v?'selected':''}>${FD(p.d)}${p.w?' · '+p.w:''}</option>`).join('')}</select>`;
sheet('לפני / אחרי',`<div class='phx' id='phx'><img src='${A.src}' alt=''><div class='phx2' id='phx2'><img src='${B.src}' alt=''></div><div class='phl' id='phl'></div></div><input type='range' min='0' max='100' value='50' class='phr' oninput="$('#phx2').style.clipPath='inset(0 '+this.value+'% 0 0)';$('#phl').style.left=(100-this.value)+'%'">
<div class='duo' style='margin-top:12px'><div><div class='flb'>לפני</div>${o('a',a)}</div><div><div class='flb'>אחרי</div>${o('b',b)}</div></div>${A.w&&B.w?`<div class='card' style='text-align:center;font-size:18px;font-weight:700;margin-top:12px'>${+(B.w-A.w).toFixed(1)>0?'+':''}${+(B.w-A.w).toFixed(1)} ק״ג</div>`:''}`);setTimeout(()=>{const x=$('#phx2');if(x)x.style.clipPath='inset(0 50% 0 0)'},0)}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
