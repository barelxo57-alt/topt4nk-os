<div class="sh" id="sh" hidden><div class="shh"><b id="sht"></b><button class='ib' id='hxb' hidden><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 2'/></svg></button><button class='ib' onclick='closeSh()'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round'><path d='M6 6l12 12M18 6L6 18'/></svg></button></div><div id="shb"></div></div>
<script>
const $=s=>document.querySelector(s),K='topt4nk_os_v1',DN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const CH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
const ch=(t,c)=>`<div class="ch" style="color:${c}"><span>${t}</span>${CH}</div>`;
const MORN=['סידור המיטה','צחצוח שיניים ו־500 מ״ל מים','הנחת תפילין','מקלחת קרה','קריאת ספר'];
function sched(){const s=['פיתוח אישי (שון מוסייב) + שוק ההון (דניאל דמרי)','תיאוריה והלחנה (JUST MUSIC) + KXVI','צילום ועריכת וידאו (סאני) + שוק ההון','שון מוסייב + JUST MUSIC – Ableton','צילום ועריכת וידאו (סאני)','קורס אחד בפוקוס שבועי'],w=['אימון A/B','אימון A/B','אירובי / ריצה / חבל / איגרוף','אימון A/B','אירובי / ריצה / חבל / איגרוף','אימון A/B'];
return s.map((x,i)=>`04:45 רוטינת בוקר\n06:00 ${w[i]}\n07:00 ארוחה 1 והכנת תיק קירור\n08:00 לימוד: ${x}\n12:00 פרקטיקה\n16:00 התאוששות\n20:30 סגירת יום ויומן\n21:00 כיבוי אורות`).concat(['06:00 מנוחה והליכה\n21:00 כיבוי אורות'])}
function init(){const e=(n,w,r)=>({n,w,r});return{days:{},chk:{},ses:[],wt:[],h:[],jr:{},cw:'A',
g:{d:[{id:'wake',t:'קימה לפני 05:00'},{id:'steps',t:'15,000 צעדים',auto:'steps',target:15000},{id:'water',t:'3.5 ליטר מים',auto:'water',target:3.5},{id:'wo',t:'אימון / אירובי',auto:'wo'},{id:'study',t:'3 שעות לימוד',auto:'study',target:3},{id:'book',t:'10 עמודים בספר'}],
w:[{id:'w1',t:'ירידה של 1.2 ק״ג',auto:'wloss',target:1.2},{id:'w2',t:'שעות לימוד שבועיות',auto:'wstudy',target:15},{id:'w3',t:'צעדים שבועיים',auto:'wsteps',target:105000},{id:'w4',t:'מספר אימונים',auto:'wwo',target:6}],
m:[{id:'m1',t:'ירידה כוללת של 6 ק״ג'},{id:'m2',t:'העלאת כוח ב־Bench, Squat ו־Lat Pulldown'},{id:'m3',t:'הקטנת היקף מותניים ב־2–3 ס״מ'}]},
s:sched(),
w:{A:[e('בנץ׳ חזה',24,[12,10]),e('דחיפת חזה',15,[15,13]),e('הרחקת כתפיים',10,[10,10]),e('דחיפת כתפיים',18,[15,10]),e('יד אחורית – דחיפה למטה',41,[15,12]),e('דחיפה מעל הראש',27,[13,13])],
B:[e('סקווט במכונה',80,[16,16]),e('לאנצ׳ים',10,[15,15]),e('חתירה',72,[10,12]),e('פולי',52,[20,11]),e('יד קדמית',8,[15,15]),e('פטישים',15,[15,15])],
C:[e('הליכון (קצב לב ממוצע 150)',20,[20,2.1,150])]},
co:[{id:1,n:'Sean Musaev – פיתוח אישי',tot:20,lh:2,ls:10,done:0},{id:2,n:'Daniel Damari – שוק ההון',tot:30,lh:2,ls:15,done:0},{id:3,n:'Sunny – צילום ועריכת וידאו',tot:15,lh:1.5,ls:8,done:0},{id:4,n:'JUST MUSIC – תיאוריה והלחנה',tot:20,lh:2,ls:10,done:0},{id:5,n:'KXVI',tot:10,lh:1,ls:10,done:0}],
tg:{p:170,c:230,f:55,k:2000}}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||init();
S.g.m.forEach(g=>{if(g.id=='m1'&&!g.auto){g.auto='mloss';g.target=6}if(g.id=='m3'&&!g.auto){g.auto='mwaist';g.target=2}});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const day=(k=dk())=>S.days[k]??={steps:0,water:0,p:0,c:0,f:0,k:0,done:{},m:[],wo:0};
const studyH=k=>S.ses.filter(s=>s.d==k).reduce((a,s)=>a+s.min/60,0);
function isDone(g,k){const d=S.days[k]||{};if(d.done&&g.id in d.done)return d.done[g.id]?1:0;const a=g.auto;
if(a=='steps')return d.steps>=g.target?1:0;if(a=='water')return d.water>=g.target?1:0;if(a=='wo')return d.wo?1:0;if(a=='study')return studyH(k)>=g.target?1:0;return 0}
function gFrac(g,k){const d=S.days[k]||{};if(d.done&&g.id in d.done)return d.done[g.id]?1:0;const a=g.auto,t=g.target||1;
if(a=='steps')return Math.min(1,(d.steps||0)/t);if(a=='water')return Math.min(1,(d.water||0)/t);if(a=='wo')return d.wo?1:0;if(a=='study')return Math.min(1,studyH(k)/t);return 0}
function dayFrac(k){const d=S.days[k]||{};let s=0;S.g.d.forEach(g=>s+=gFrac(g,k));MORN.forEach((_,i)=>{if(d.m&&d.m[i])s++});return s/(S.g.d.length+MORN.length)}
function dayStat(k){const d=S.days[k]||{};let n=0,t=0;S.g.d.forEach(g=>{t++;n+=isDone(g,k)});MORN.forEach((_,i)=>{t++;if(d.m&&d.m[i])n++});return[n,t]}
function weekKeys(){const o=[],n=new Date();for(let i=n.getDay();i>=0;i--){const x=new Date(n);x.setDate(n.getDate()-i);o.push(dk(x))}return o}
function monthKeys(){const o=[],n=new Date();for(let i=1;i<=n.getDate();i++)o.push(dk(new Date(n.getFullYear(),n.getMonth(),i)));return o}
function wVal(g){const ks=weekKeys(),sum=f=>ks.reduce((a,k)=>a+f(k),0);
if(g.auto=='wstudy')return sum(studyH);if(g.auto=='wsteps')return sum(k=>(S.days[k]||{}).steps||0);if(g.auto=='wwo')return sum(k=>(S.days[k]||{}).wo?1:0);
if(g.auto=='wloss'){const wk=S.wt.filter(x=>x.d>=ks[0]),b=S.wt.filter(x=>x.d<ks[0]).pop()||wk[0];return b&&wk.length?+(b.w-wk[wk.length-1].w).toFixed(1):0}return 0}
const wFrac=g=>{const c=S.chk[weekKeys()[0]+g.id];if(c!==undefined)return c?1:0;return g.auto?Math.min(1,Math.max(0,wVal(g))/(g.target||1)):0};
const wDone=g=>wFrac(g)>=1;
function mVal(g){if(g.auto!='mloss'&&g.auto!='mwaist')return 0;const p=dk().slice(0,7),f=g.auto=='mwaist'?'wa':'w',a=S.wt.filter(x=>x[f]),m=a.filter(x=>x.d>=p),b=a.filter(x=>x.d<p).pop()||m[0];return b&&m.length?+(b[f]-m[m.length-1][f]).toFixed(1):0}
const mFrac=g=>{const c=S.chk[dk().slice(0,7)+g.id];if(c!==undefined)return c?1:0;return g.auto?Math.min(1,Math.max(0,mVal(g))/(g.target||1)):0};
const mDone=g=>mFrac(g)>=1;
const fr=(a,f)=>a.length?a.reduce((s,g)=>s+f(g),0)/a.length:0;
function range(ks,goals,fn){let n=0,t=0;ks.forEach(k=>{const[a,b]=dayStat(k);n+=a;t+=b});goals.forEach(g=>{t++;if(fn(g))n++});return[n,t]}
const RP={};
function ring(r,p,c){const L=2*Math.PI*r,t=L*Math.min(Math.max(p,0),1),s=RP[r]??0;RP[r]=t;return`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${c}" stroke-opacity=".2" stroke-width="11"/><circle data-d="${t} ${L}" cx="60" cy="60" r="${r}" fill="none" stroke="${c}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${s} ${L}" opacity="${t>.5||s>.5?1:0}" transform="rotate(-90 60 60)"/>`}
function blocks(dw){return S.s[dw].split('\n').map(l=>{const m=l.match(/^\s*(\d{1,2}):(\d{2})\s*(?:[-–]\s*(\d{1,2}):(\d{2}))?\s*(.*)$/);return m&&{s:+m[1]*60+ +m[2],e:m[3]?+m[3]*60+ +m[4]:null,t:m[5]}}).filter(Boolean).sort((a,b)=>a.s-b.s).map((b,i,a)=>({...b,e:b.e??(a[i+1]?a[i+1].s:1440)}))}
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
let tab='s',cw=S.cw||'A',tm={left:5400,tot:5400,run:0,cid:1},ge=0,sent={};

function render(){['w','s','l'].forEach(x=>$('#n-'+x).classList.toggle('on',x==tab));$('#ttl').textContent={w:'אימונים',s:'סיכום',l:'לימודים'}[tab];
$('#v').innerHTML={w:rW,s:rS,l:rL}[tab]();tick();requestAnimationFrame(()=>{void document.body.offsetWidth;document.querySelectorAll('circle[data-d]').forEach(c=>c.style.strokeDasharray=c.dataset.d)})}

setInterval(tick,30000);

function tm_(i){day().m[i]=!day().m[i];save();render()}


function closeSh(){$('#sh').hidden=true;render()}
/* בריאות */

function aw(x){const d=day();d.water=Math.max(0,+(d.water+x).toFixed(2));save();$('#hw').textContent=d.water+'/3.5L'}
function sw(){const g=a=>+$('#m_'+a).value||0,w=g('w');if(!w)return;const l=S.wt[S.wt.length-1],e={d:dk(),w,ch:g('ch'),wa:g('wa'),hi:g('hi'),le:g('le'),ar:g('ar'),be:g('be')};S.wt.push(e);save();
let t='נשמר בהיסטוריה.';if(l){const df=+(w-l.w).toFixed(1);t+=` משקל ${df<=0?'ירד':'עלה'} ב־${Math.abs(df)} ק״ג מהשקילה הקודמת.`;if(l.wa&&e.wa)t+=` מותן ${(e.wa-l.wa).toFixed(1)}.`}
['w','ch','wa','hi','le','ar','be'].forEach(a=>{const el=$('#m_'+a);if(el)el.value=''});$('#wr').textContent=t;render()}
/* יעדים */

function tg(key,id,v){if(key=='d')day().done[id]=v;else S.chk[(key=='w'?weekKeys()[0]:dk().slice(0,7))+id]=v;save()}
/* יומן */

function sj(){const v=id=>$('#'+id).value,s=+v('js');if(!s||s<1||s>10){$('#js').style.borderColor='#fa114f';return}
S.jr[dk()]={score:s,g:[v('jg0'),v('jg1'),v('jg2')],feel:v('jf'),i:{w:v('jw'),l:v('jl'),o:v('jo')},vip:v('jv'),vipDone:$('#jvd').checked,th:v('jt'),dump:v('jd')};save();closeSh()}
function jv(k){const j=S.jr[k];sheet('יומן · '+k,`<div class="card" style="line-height:1.8"><b>ציון ${j.score}/10</b><br>🙏 ${j.g.filter(Boolean).map(esc).join(' · ')||'—'}<br>❤️ ${esc(j.feel)||'—'}<br>🔍 אימונים: ${esc(j.i.w)||'—'} · לימודים: ${esc(j.i.l)||'—'} · אחר: ${esc(j.i.o)||'—'}<br>🚀 ${esc(j.vip)||'—'}<br>💭 ${esc(j.th)||'—'}<hr style="border-color:#333"><div style="white-space:pre-wrap">${esc(j.dump)||'—'}</div></div><button style="margin-top:12px" onclick="jSheet()">חזרה</button>`)}
/* אימונים */

function eSheet(i){const x=i>=0?S.w[cw][i]:{n:''};sheet(i>=0?'עריכת תרגיל':'תרגיל חדש',`<input id="en" value="${esc(x.n)}" placeholder="שם התרגיל"><button class="pr" style="margin-top:12px" onclick="se(${i})">שמור</button>${i>=0?`<button class="dg" style="margin-top:12px;width:100%" onclick="S.w[cw].splice(${i},1);save();closeSh()">מחק תרגיל</button>`:''}`)}
function se(i){const n=$('#en').value.trim();if(!n)return;if(i>=0)S.w[cw][i].n=n;else S.w[cw].push(cw=='C'?{n,w:20,r:[20,2,140]}:{n,w:20,r:[12,10]});save();closeSh()}
function fw(){const L=S.w[cw],last=[...S.h].reverse().find(h=>h.t==cw);let vol=0,ups=[],snap=[];
L.forEach(x=>{snap.push({n:x.n,w:x.w,r:[...x.r]});x.prev={w:x.w,r:[...x.r]};if(cw=='C'){vol+=(+x.r[1])||0;x.tgt=null}else{vol+=x.w*x.r.reduce((a,b)=>a+b,0);if(x.r[1]>15||x.r.slice(-1)[0]>15){ups.push(x.n);x.tgt={w:x.w+2,r:x.r.map((_,i)=>i?10:12)}}else x.tgt=null}x.w=0;x.r=x.r.map(()=>0)});
vol=Math.round(vol*10)/10;const df=last&&last.vol?Math.round((vol-last.vol)/last.vol*100):null;day().wo=1;S.h.push({d:dk(),t:cw,vol,note:'',ex:snap});save();render();
sheet('סיכום אימון',`<div class="card"><div class="big">${cw=='C'?vol+' ק״מ':vol.toLocaleString()+' ק״ג נפח'}</div><div style="margin-top:8px">${df==null?'אימון ראשון נשמר – מכאן מודדים התקדמות.':df>=0?`💪 ${df}% יותר מהאימון הקודם. מעולה.`:`📉 ${Math.abs(df)}% פחות מהאימון הקודם. בדוק שינה וחלבון, ובאימון הבא חזור למשקלים.`}</div>${ups.length?`<div style="margin-top:8px;color:var(--g)">⬆️ יעד לאימון הבא: +2 ק״ג ב־${ups.map(esc).join(', ')}</div>`:''}<div class="mu" style="margin-top:8px">האימון נשמר בהיסטוריה והשדות אופסו לאימון הבא.</div></div>
<div class="card" style="margin-top:12px"><b>איך הרגשת? למה היה טוב או פחות?</b><textarea id="fn" rows="3" style="margin-top:8px"></textarea></div><button class="pr" style="margin-top:12px" onclick="S.h[S.h.length-1].note=$('#fn').value;save();closeSh()">שמור הערה</button>`)}
/* לימודים */

function qv(i){const s=S.ses[i];sheet('סשן '+s.d,`<div class="card" style="line-height:1.8"><b>3 דברים חדשים</b><div style="white-space:pre-wrap">${esc(s.nw)||'—'}</div><b>3 דברים ליישם</b><div style="white-space:pre-wrap">${esc(s.ap)||'—'}</div><b>איך היה</b><div style="white-space:pre-wrap">${esc(s.tx)||'—'}</div></div>`)}
function cSheet(i){const c=i>=0?S.co[i]:{n:'',tot:20,lh:2,ls:10},f=(id,n,v)=>`<span class="mu">${n}</span><input id="${id}" ${id=='cn'?'':'type="number" step=".5"'} value="${esc(v)}" style="margin-bottom:8px">`;
sheet(i>=0?'עריכת קורס':'קורס חדש',f('cn','שם הקורס',c.n)+f('ct','אורך הקורס המלא (שעות)',c.tot)+f('cl','אורך שיעור (שעות)',c.lh)+f('cs','כמות שיעורים',c.ls)+`<button class="pr" onclick="sc(${i})">שמור</button>${i>=0?`<button style="margin-top:10px;width:100%" onclick="S.co[${i}].done+=1;save();cSheet(${i})">+ שעת לימוד ידנית</button><button class="dg" style="margin-top:10px;width:100%" onclick="S.co.splice(${i},1);save();closeSh()">מחק קורס</button>`:''}`)}
function sc(i){const n=$('#cn').value.trim();if(!n)return;const o={n,tot:+$('#ct').value||1,lh:+$('#cl').value||1,ls:+$('#cs').value||1};if(i>=0)Object.assign(S.co[i],o);else S.co.push({id:Date.now(),done:0,...o});save();closeSh()}

function tdur(m){if(tm.run)return;tm.left=tm.tot=m*60;td()}

function tt(){if(tm.run){tm.left=Math.round((tm.end-Date.now())/1000);tm.run=0;clearInterval(tm.i)}else{tm.end=Date.now()+tm.left*1000;tm.run=1;tm.i=setInterval(()=>{td();if(Date.now()>=tm.end){clearInterval(tm.i);tm.run=0;tm.left=0;if($('#td'))qSheet()}},1000)}$('#tb')&&($('#tb').textContent=tm.run?'השהה':'התחל');td()}
function qSheet(){if(tm.run){tm.left=Math.round((tm.end-Date.now())/1000);tm.run=0;clearInterval(tm.i)}const el=Math.max(1,Math.round((tm.tot-tm.left)/60));tm.el=el;
sheet('שאלון סיום שיעור',`<div class="mu">למדת ${el} דקות</div><span class="mu">3 דברים חדשים שלמדת</span><textarea id="q1" rows="3"></textarea><span class="mu">3 דברים ליישם בפועל</span><textarea id="q2" rows="3"></textarea><span class="mu">איך היה? טקסט חופשי</span><textarea id="q3" rows="3"></textarea><button class="pr" style="margin-top:12px" onclick="sq()">שמור בהיסטוריה</button>`)}
function sq(){S.ses.push({d:dk(),cid:tm.cid,min:tm.el,nw:$('#q1').value,ap:$('#q2').value,tx:$('#q3').value});const c=S.co.find(x=>x.id==tm.cid);if(c)c.done+=tm.el/60;tm.left=tm.tot;save();closeSh()}
/* תפריט */

function nt(){if(window.Notification)Notification.requestPermission().then(()=>closeSh());else closeSh()}

function sl(v){$('#st').value=S.s[+v]}

function histSheet(t){if(t=='j')return jh();const T={w:'היסטוריית אימונים',h:'היסטוריית בריאות',b:'היסטוריית גוף',m:'היסטוריית רוטינת בוקר',g:'היסטוריית יעדים'}[t],days=Object.keys(S.days).sort().reverse();let b='';
if(t=='w'){const TN={A:'אימון A',B:'אימון B',C:'אירובי'},CC={A:'#fa114f',B:'#bf5af2',C:'#00e5ff'};b=S.h.map((h,i)=>[h,i]).reverse().slice(0,60).map(([h,i])=>hcard(CC[h.t]||'#fa114f',FD(h.d)+' · '+(TN[h.t]||h.t),(h.t=='C'?h.vol+' ק״מ':'נפח '+(+h.vol).toLocaleString()+' ק״ג')+(h.note?' · '+esc(h.note.slice(0,40)):''),'',`whd(${i})`)).join('')}
else if(t=='h'){b=days.filter(k=>{const d=S.days[k];return d.steps||d.water||d.k||d.p||d.c||d.f}).slice(0,60).map(k=>{const d=S.days[k];return hcard('#ff375f',FD(k),`👣 ${(+d.steps||0).toLocaleString()} צעדים · 💧 ${+(+d.water||0).toFixed(2)} ל׳<br>🍽 חלבון ${d.p||0} · פחמימה ${d.c||0} · שומן ${d.f||0} · ${d.k||0} קלוריות`)}).join('')}
else if(t=='b'){b=S.wt.map((e,i)=>[e,i]).reverse().slice(0,60).map(([e,i])=>{const p=S.wt[i-1],df=p?+(e.w-p.w).toFixed(1):null,m=[['ch','חזה'],['wa','מותן'],['hi','ירך'],['le','רגליים'],['ar','ידיים'],['be','בטן']].filter(([a])=>e[a]).map(([a,n])=>n+' '+e[a]).join(' · ');return hcard('#bf5af2',FD(e.d),(m||'ללא היקפים')+(df!=null?`<br>${df<=0?'▼':'▲'} ${Math.abs(df)} ק״ג מהשקילה הקודמת`:''),`<b style='font-size:24px'>${e.w}<small class='mu' style='font-size:13px'> ק״ג</small></b>`)}).join('')}
else if(t=='m'){b=days.filter(k=>(S.days[k].m||[]).some(Boolean)).slice(0,60).map(k=>{const m=S.days[k].m||[],n=m.filter(Boolean).length;return hcard('#ff9f0a',FD(k),MORN.filter((_,i)=>m[i]).map(esc).join(' · '),`<b style='font-size:22px;color:#ff9f0a'>${n}/${MORN.length}</b>`)}).join('')}
else if(t=='g'){b=days.filter(k=>{const d=S.days[k];return dayFrac(k)>0}).slice(0,60).map(k=>{const [a,n]=dayStat(k),p=Math.round(dayFrac(k)*100);return hcard('#fa114f',FD(k),`${a}/${n} הושלמו`+(S.g.d.filter(g=>isDone(g,k)).length?'<br>'+S.g.d.filter(g=>isDone(g,k)).map(g=>'✓ '+esc(g.t)).join(' · '):''),`<b style='font-size:24px;color:#fa114f'>${p}<small class='mu' style='font-size:13px'>%</small></b>`)}).join('')}
sheet(T,b||NONE)}
function whd(i){const h=S.h[i];if(!h)return;const C=h.t=='C';sheet('אימון · '+FD(h.d),`<div class='card' style='line-height:1.9'>${(h.ex||[]).map(x=>`<div class='row'><b>${esc(x.n)}</b><span class='mu'>${C?x.r[0]+' דק׳ · '+x.r[1]+' ק״מ · דופק '+x.r[2]:x.w+' ק״ג · '+x.r.join(' / ')}</span></div>`).join('')||`<div class='mu'>לא נשמר פירוט לאימון הזה</div>`}</div>${h.note?`<div class='card' style='margin-top:12px'><b>הערה</b><div style='white-space:pre-wrap;margin-top:6px'>${esc(h.note)}</div></div>`:''}<button style='margin-top:12px;width:100%' onclick="histSheet('w')">חזרה להיסטוריה</button>`)}
function perRing(keys,total,goals,fn){const dd=keys.reduce((s,k)=>s+dayFrac(k),0)/total,gg=goals.length?goals.reduce((s,g)=>s+fn(g),0)/goals.length:null;return gg==null?Math.min(1,dd):Math.min(1,dd*.5+gg*.5)}
function wRing(){return perRing(weekKeys(),7,S.g.w,wFrac)}
function mRing(){const n=new Date();return perRing(monthKeys(),new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),S.g.m,mFrac)}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
</script></body></html>
